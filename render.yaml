services:
  - type: web
    name: student-performance-ai-api
    runtime: python
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn backend.main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /
    envVars:
      - key: OLLAMA_URL
        sync: false
      - key: OLLAMA_MODEL
        value: oamazonasgabriel/lfm2.5-230m:bf16-8gbRAM
      - key: OLLAMA_TIMEOUT_SECONDS
        value: "120"
      - key: OLLAMA_API_KEY
        sync: false
